<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Giantstride - Character Designer" />
    <meta property="og:description" content="Inspired by the 1989 Sega game, Crack Down, this is the beginning of a rethink using Three.JS and a bunch of wonderful javascript for the underlying engine. And this, is the character designer." />
    <meta property="og:image" content="https://giantstride.space/resources/web/Preview20260816.png" />
    <meta property="og:url" content="https://giantstride.space/character" />
    <meta property="og:type" content="website" />
    <meta name="description" content="Inspired by the 1989 Sega game, Crack Down, this is the beginning of a rethink using Three.JS and a bunch of wonderful javascript for the underlying engine. And this, is the character designer.">
    <title>Giantstride - Character Designer</title>
  </head>
  <body id="swipe-zone">
    <div id="app"></div>
    <script type="module" src="/src/character.js"></script>
    <div id="character-control-container">
      <label>mesh</label>
      <select id="ddlMesh">
        <option value="Engineer" selected>Engineer</option>
        <option value="Soldier">Soldier</option>
        <option value="Scientist">Scientist</option>
        <option value="Blank">Blank</option>
      </select>
      <label>speed</label>
      <select id="ddlSpeed">
        <option value="6">Fast</option>
        <option value="4" selected>Medium</option>
        <option value="2">Slow</option>
        <option value="0">Stopped</option>
      </select>
      <label>include</label><br/>
      <label><input type="checkbox" id="chkIncludeFace" checked/> face</label><br/>
      <label><input type="checkbox" id="chkIncludeChest" checked/> chest</label><br/>
      <label><input type="checkbox" id="chkIncludeRightArm" checked/> right arm</label><br/>
      <label><input type="checkbox" id="chkIncludeRightForeArm" checked/> right fore arm</label><br/>
      <label><input type="checkbox" id="chkIncludeRightHand" checked/> right hand</label><br/>
      <label><input type="checkbox" id="chkIncludeLeftArm" checked/> left arm</label><br/>
      <label><input type="checkbox" id="chkIncludeLeftForeArm" checked/> left fore arm</label><br/>
      <label><input type="checkbox" id="chkIncludeLeftHand" checked/> left hand</label><br/>
      <label><input type="checkbox" id="chkIncludeWaist" checked/> waist</label><br/>
      <label><input type="checkbox" id="chkIncludeRightLeg" checked/> right leg</label><br/>
      <label><input type="checkbox" id="chkIncludeLeftLeg" checked/> left leg</label><br/>
      <label>holding</label><br/>
      <label><input type="radio" name="using" id="chkHoldingNothing" checked/> nothing</label><br/>
      <label><input type="radio" name="using" id="chkHoldingBox"/> box</label><br/>
      <label><input type="radio" name="using" id="chkHoldingSmg"/> weapon</label><br/>
      <label><input type="radio" name="using" id="chkHoldingClipBoard"/> clipboard</label><br/>
      <label>action</label><br/>
      <label><input type="radio" name="action" id="chkActionHolding" checked/> holding</label><br/>
      <label><input type="radio" name="action" id="chkActionUsing"/> using</label><br/>
    </div>
    <div id="character-control-result">
      <label id="lblResult"></label>
    </div>
    <img src="/resources/web/Preview20260816.png" style="display: none"/>
  </body>
</html>
