<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Crack Down Remake" />
    <meta property="og:description" content="Inspired by the 1989 Sega game, Crack Down, this is the beginning of a redisgn using Three.JS as the underlying engine." />
    <meta property="og:image" content="https://3dpolygonez.github.io/CrackDown/resources/web/Preview20260724.png" />
    <meta property="og:url" content="https://3dpolygonez.github.io/CrackDown/" />
    <meta property="og:type" content="website" />
    <meta name="description" content="Inspired by the 1989 Sega game, Crack Down, this is the beginning of a redisgn using Three.JS as the underlying engine.">
    <title>Crack Down Remake</title>
  </head>
  <body id="swipe-zone">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <div id="cam-container">
      <button class="dpad-btn" id="cam-change" style="background-color: transparent; border: none;">📷</button>
    </div>
    <div id="dpad-container" style="display: none">
      <button class="dpad-btn" id="dpad-upleft">↖</button>
      <button class="dpad-btn" id="dpad-up">↑</button>
      <button class="dpad-btn" id="dpad-upright">↗</button>
      <button class="dpad-btn" id="dpad-left">←</button>
      <button class="dpad-btn" id="dpad-random" style="background-color: transparent; border: none;">🧑</button>
      <button class="dpad-btn" id="dpad-right">→</button>
      <button class="dpad-btn" id="dpad-downleft">↙</button>
      <button class="dpad-btn" id="dpad-down">↓</button>
      <button class="dpad-btn" id="dpad-downright">↘</button>
    </div>
    <img src="/resources/web/Preview20260724.png" style="display: none"/>
  </body>
</html>
